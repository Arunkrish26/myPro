<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyFinance — Signing in</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("myfinance-theme") || "light";</script>
</head>
<body class="auth-page">
  <div class="auth-card callback-card">
    <div class="brand">
      <div class="brand-mark">₹</div>
      <h1>Signing you in…</h1>
      <p>Please wait while we finish setting up your account.</p>
    </div>
    <div id="callbackError" class="alert error hidden" role="alert"></div>
    <div class="callback-spinner">
      <div class="spinner"></div>
    </div>
  </div>

  <script type="module" src="js/auth-callback.js"></script>
</body>
</html>
